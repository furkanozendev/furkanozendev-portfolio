<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg-portfolio" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#101014"/>
            <stop offset="50%" stop-color="#202028"/>
            <stop offset="100%" stop-color="#11111A"/>
        </linearGradient>
        <linearGradient id="accent-portfolio" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#BD93F9"/>
            <stop offset="100%" stop-color="#8BE9FD"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="1280" height="720" fill="url(#bg-portfolio)"/>

    <!-- Subtle grid -->
    <g opacity="0.12">
        <defs>
            <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
                <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#303040" stroke-width="1"/>
            </pattern>
        </defs>
        <rect width="1280" height="720" fill="url(#grid)"/>
    </g>

    <!-- Accent bars -->
    <rect x="160" y="220" width="6" height="280" rx="3" fill="url(#accent-portfolio)" opacity="0.9"/>
    <rect x="1114" y="220" width="6" height="280" rx="3" fill="url(#accent-portfolio)" opacity="0.5"/>

    <!-- Floating chips -->
    <rect x="190" y="180" rx="14" ry="14" width="170" height="34" fill="#181824" stroke="#333347" stroke-width="1"/>
    <text x="205" y="203" fill="#8BE9FD" font-size="14"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        Kotlin · Compose Multiplatform
    </text>

    <rect x="920" y="510" rx="14" ry="14" width="210" height="34" fill="#181824" stroke="#333347" stroke-width="1"
          opacity="0.9"/>
    <text x="935" y="533" fill="#BD93F9" font-size="14"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        Responsive web · Bento layout
    </text>

    <!-- Main title -->
    <text x="190" y="310" fill="#F5F5F5" font-size="40" font-weight="700"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        Portfolio · Compose Multiplatform Web
    </text>

    <!-- Subtitle -->
    <text x="190" y="350" fill="#C0C0CC" font-size="20"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        System-inspired UI · Kotlin-first architecture · Web target
    </text>

    <!-- Small tech tags -->
    <text x="190" y="395" fill="#8BE9FD" font-size="14"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        Kotlin · Compose Multiplatform · Gradle · KMP
    </text>
</svg>
