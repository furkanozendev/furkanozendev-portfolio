<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg-github" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#050509"/>
            <stop offset="40%" stop-color="#151521"/>
            <stop offset="100%" stop-color="#101014"/>
        </linearGradient>

        <linearGradient id="accent-github" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#BD93F9"/>
            <stop offset="100%" stop-color="#8BE9FD"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="1280" height="720" fill="url(#bg-github)"/>

    <!-- Code-like columns -->
    <g opacity="0.18">
        <rect x="160" y="140" width="220" height="360" rx="18" ry="18" fill="#171722"/>
        <rect x="530" y="120" width="260" height="390" rx="18" ry="18" fill="#171722"/>
        <rect x="910" y="170" width="210" height="340" rx="18" ry="18" fill="#171722"/>
    </g>

    <!-- Small pseudo-code lines in the center card -->
    <g opacity="0.65">
        <rect x="560" y="150" width="180" height="10" rx="5" ry="5" fill="#2B2B3A"/>
        <rect x="560" y="170" width="130" height="8" rx="4" ry="4" fill="#2B2B3A"/>
        <rect x="560" y="195" width="200" height="8" rx="4" ry="4" fill="#2B2B3A"/>

        <rect x="560" y="230" width="90" height="8" rx="4" ry="4" fill="#2B2B3A"/>
        <rect x="560" y="250" width="170" height="8" rx="4" ry="4" fill="#2B2B3A"/>
        <rect x="560" y="270" width="140" height="8" rx="4" ry="4" fill="#2B2B3A"/>

        <rect x="560" y="305" width="200" height="8" rx="4" ry="4" fill="#2B2B3A"/>
        <rect x="560" y="325" width="110" height="8" rx="4" ry="4" fill="#2B2B3A"/>
    </g>

    <!-- Accent underline -->
    <rect x="320" y="420" width="640" height="3" fill="url(#accent-github)" opacity="0.9"/>

    <!-- Title -->
    <text x="340" y="470" fill="#F5F5F5" font-size="34" font-weight="700"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        More Projects on GitHub
    </text>

    <!-- Subtitle -->
    <text x="340" y="505" fill="#C0C0CC" font-size="18"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        Kotlin, Compose, compiler plugins, Gradle tooling, backends and SDK experiments.
    </text>

    <!-- Small tag line -->
    <text x="340" y="535" fill="#8BE9FD" font-size="14"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        github.com/furkanozendev
    </text>
</svg>
