name: Deploy Compose Multiplatform Web to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build wasmJs browser distribution
        run: ./gradlew wasmJsBrowserDistribution

      - name: Verify build output
        run: |
          echo "Listing production output:"
          ls -la composeApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy
            composeApp/build/dist/wasmJs/productionExecutable
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}